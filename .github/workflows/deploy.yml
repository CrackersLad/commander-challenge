name: Deploy to Firebase

on:
  push:
    branches:
      - main # Make sure this is your repository's default branch (e.g., main, master)

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # From your functions/package.json

      - name: Install dependencies
        run: npm install --prefix functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions,hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project commander-challenge --non-interactive