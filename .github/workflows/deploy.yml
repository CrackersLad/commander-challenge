name: Deploy to Firebase

on:
  push:
    branches:
      - main # Make sure this is your repository's default branch (e.g., main, master)

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Must match functions/package.json

      - name: Install dependencies
        run: |
          cd functions
          rm -f package-lock.json
          npm install --no-audit --no-fund || (sleep 5 && npm install --no-audit --no-fund)

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: firebase deploy --only functions,hosting,database --token "${{ secrets.FIREBASE_CREDENTIALS }}" --project commander-challenge --non-interactive